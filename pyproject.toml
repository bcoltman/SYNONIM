[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synonim"
version = "0.1.0"
description = "Tool for designing synthetic microbial communities"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Benjamin Coltman", email = "benjamin.coltman@univie.ac.at"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "threadpoolctl"
]
keywords = ["microbial community", "SynCom", "synthetic communities", "environmental biotechnology"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]

[project.urls]
Homepage = "https://github.com/bcoltman/synonim"
Documentation = "https://synonim.readthedocs.io"
Source = "https://github.com/bcoltman/synonim"
Tracker = "https://github.com/bcoltman/synonim/issues"

[project.optional-dependencies]
dev = ["pytest", "black", "isort", "mypy"]
milp = ["gurobipy"]

[tool.pytest.ini_options]
markers = [
    "milp: marks tests that require optional Gurobi-backed MILP support",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial",
]
